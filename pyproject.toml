[project]
name = "dem-profile"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "rasterio>=1.5.0",
]

[project.scripts]
dem-profile = "dem_profile:main"
dem-profile-pick = "dem_profile.pick_transect:main"
dem-profile-pick-gui = "dem_profile.pick_transect_gui:main"
dem-profile-prepare-web = "dem_profile.prepare_web_data:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
